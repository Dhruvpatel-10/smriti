[package]
name = "smriti"
version = "0.1.0"
edition = "2024"
description = "Persistent second memory for your personal AI system — local-first MCP server backed by SurrealDB."
license = "AGPL-3.0-only"

[[bin]]
name = "smriti"
path = "src/main.rs"

[lib]
name = "smriti"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1.3", features = ["server", "transport-async-rw", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1", "http2"] }
http-body-util = "0.1"
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
config = "0.14"
fastembed = "5"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
schemars = { version = "1", features = ["chrono04"] }
tempfile = { version = "3", optional = true }
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[features]
default = []
test-mem = ["surrealdb/kv-mem"]
